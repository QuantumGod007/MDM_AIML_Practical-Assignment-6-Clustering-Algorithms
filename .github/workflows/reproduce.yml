name: Validate and publish experiment results
on:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Generate numerical results and charts
        run: python clustering_models.py
      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "results: publish verified clustering tables and plots"
            git push
          fi
